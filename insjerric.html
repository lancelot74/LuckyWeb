<style>
  html, body { margin:0; padding:0; background:#070407; color:#f4eef6;
               font-family:'Space Grotesk', system-ui, sans-serif;
               -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body { overflow-x: hidden; }

  /* Booting splash so the page never shows raw markup before React mounts */
  .splash { position:fixed; inset:0; background:#070407; color:#ff2d8d;
            display:flex; align-items:center; justify-content:center;
            font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:.3em;
            text-transform:uppercase; z-index:10000; transition:opacity .4s; }
  .splash.gone { opacity:0; pointer-events:none; }

  /* ── responsive layer (mobile + tablet overrides for the Neon Pulse site) ──
     The component injects its <style> AFTER this block, so rules are prefixed
     with `body` to win the specificity tie. */
  html, body { overflow-x: hidden; }
  #root { width: 100%; max-width: 1280px; margin: 0 auto; }
  body .vA { width: 100% !important; max-width: 1280px; }

<!-- ─────────────────────────  KANPAI POUR ANIMATION  ───────────────────────── -->
<script type="text/babel">
// KanpaiPour — SVG/CSS auto-loop animation for the Neon Pulse hero.
// A bottle descends, pours three shot glasses one by one. The glasses then
// slide to the center for a kanpai (干杯) clink — a flash + splash droplets
// shoot out, the headline reads KANPAI, then the whole scene fades and the
// loop restarts. ~10s loop, no scroll dependency.
(function () {
  const css = `
  /* ── stage ──────────────────────────────────────── */
  .kp { position:relative; width:100%; background:#000; overflow:hidden;
        font-family:'Space Grotesk', sans-serif; color:#fff; isolation:isolate;
        height:780px; }

  .kp-bg { position:absolute; inset:0; z-index:0;
           background:
             radial-gradient(ellipse 70% 38% at 50% 18%, rgba(255,45,141,.34), transparent 65%),
             radial-gradient(ellipse 50% 50% at 12% 78%, rgba(0,240,255,.22), transparent 60%),
             radial-gradient(ellipse 55% 50% at 88% 70%, rgba(255,170,80,.20), transparent 60%),
             linear-gradient(180deg, #0a0410 0%, #150916 50%, #050306 100%); }

  .kp-bokeh { position:absolute; inset:0; pointer-events:none; z-index:1;
              background:
                radial-gradient(circle at 8%  16%, rgba(255,200,80,.55)  0 4px, transparent 5px),
                radial-gradient(circle at 22% 9%,  rgba(255,80,160,.45)  0 3px, transparent 4px),
                radial-gradient(circle at 38% 22%, rgba(255,200,180,.4)  0 4px, transparent 5px),
                radial-gradient(circle at 56% 11%, rgba(0,240,255,.4)    0 3px, transparent 4px),
                radial-gradient(circle at 72% 16%, rgba(255,140,180,.5)  0 5px, transparent 6px),
                radial-gradient(circle at 88% 25%, rgba(255,200,80,.4)   0 3px, transparent 4px),
                radial-gradient(circle at 14% 32%, rgba(255,140,180,.35) 0 2px, transparent 3px),
                radial-gradient(circle at 46% 6%,  rgba(0,240,255,.3)    0 2px, transparent 3px);
              filter: blur(1.6px);
              animation: kpBokeh 5s ease-in-out infinite alternate; }
  @keyframes kpBokeh {
    0%   { opacity:.6; transform: translateX(0)  }
    100% { opacity:1;  transform: translateX(10px) }
  }

  /* warm wood table */
  .kp-table { position:absolute; left:0; right:0; bottom:0; height:32%; z-index:2;
              background:
                linear-gradient(180deg, rgba(40,20,14,0) 0%,
                                          rgba(38,20,14,.85) 12%,
                                          rgba(22,12,8,1) 32%,
                                          rgba(10,6,4,1) 100%);
              border-top:1px solid rgba(255,150,80,.3);
              box-shadow:inset 0 1px 0 rgba(255,190,110,.35),
                         inset 0 30px 60px -20px rgba(0,0,0,.55); }
  .kp-table::before { content:""; position:absolute; left:18%; right:18%; top:-50px; height:140px;
                       background: radial-gradient(ellipse at 50% 100%, rgba(255,170,80,.3), transparent 75%);
                       pointer-events:none; }

  .kp-svg { position:absolute; inset:0; width:100%; height:100%; display:block; z-index:3; }

  /* === bottle === */
  .kp-bottle-pos { animation: kp-bottlePos 10s ease-in-out infinite; }
  .kp-bottle-rot { animation: kp-bottleRot 10s ease-in-out infinite;
                    transform-origin: 0 0; transform-box: view-box; }

  @keyframes kp-bottlePos {
    0%        { transform: translate(640px, 120px); }
    6%        { transform: translate(640px, 300px); }
    8%, 21%   { transform: translate(360px, 300px); }
    24%, 37%  { transform: translate(640px, 300px); }
    40%, 53%  { transform: translate(920px, 300px); }
    58%, 100% { transform: translate(640px, 120px); }
  }
  @keyframes kp-bottleRot {
    0%,  9%   { transform: rotate(0deg); }
    11%, 19%  { transform: rotate(60deg); }
    21%, 25%  { transform: rotate(0deg); }
    27%, 35%  { transform: rotate(60deg); }
    37%, 41%  { transform: rotate(0deg); }
    43%, 51%  { transform: rotate(60deg); }
    53%, 100% { transform: rotate(0deg); }
  }

  /* === pour streams === */
  .kp-stream { animation-duration:10s; animation-timing-function:linear;
               animation-iteration-count:infinite;
               transform-box: fill-box; transform-origin: 50% 0%; opacity:0; }
  .kp-stream-1 { animation-name: kp-stream1; }
  .kp-stream-2 { animation-name: kp-stream2; }
  .kp-stream-3 { animation-name: kp-stream3; }
  @keyframes kp-stream1 {
    0%, 11%   { opacity:0; transform: scaleY(0); }
    13%, 18%  { opacity:1; transform: scaleY(1); }
    20%, 100% { opacity:0; transform: scaleY(0); }

  /* ── animations ──────────────────────────────────── */
  @keyframes vA-fade { from { opacity:0 } to { opacity:1 } }
  @keyframes vA-rise { from { opacity:0; transform:translateY(24px) } to { opacity:1; transform:none } }
  @keyframes vA-scroll { from { transform:translateX(0) } to { transform:translateX(-50%) } }
  @keyframes vA-flicker {
    0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity:1 }
    20%, 24%, 55% { opacity:.4 }

  @keyframes vA-glitch-in {
    0%   { opacity:0; clip-path: inset(0 100% 0 0); transform: translateX(-30px) skewX(-8deg); filter:hue-rotate(80deg) }
    35%  { opacity:1; clip-path: inset(0 60% 0 0); transform: translateX(-12px) skewX(-3deg); filter:hue-rotate(40deg) }
    55%  { opacity:1; clip-path: inset(0 0 0 0); transform: translateX(4px) skewX(0); filter:hue-rotate(0deg) }

    70%  { opacity:1; transform: none }
    100% { opacity:1; transform: none; filter:hue-rotate(0deg) }
  }
  @keyframes vA-burst {
    0%   { opacity:0; transform: scale(.6) }

    70%  { opacity:.4; transform: scale(1.5) }
    100% { opacity:0; transform: scale(1.8) }

  @keyframes vA-sweep {

    30% { opacity:.9 }
    100% { transform:translateX(220%) skewX(-20deg); opacity:0 }

  .vA-flicker { animation: vA-flicker 4s 1.2s infinite, vA-glow-pulse 2.6s 1.4s infinite; }
  .vA-h1 .pink { animation: vA-glitch-in 1.1s .35s both; }

  .vA-burst { position:absolute; left:-40px; top:120px; width:520px; height:520px;
              background: radial-gradient(circle, rgba(255,45,141,.55), transparent 60%);
              pointer-events:none; animation: vA-burst 1.4s .25s both; }
  .vA-sweep { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .vA-sweep::after { content:""; position:absolute; top:0; bottom:0; width:35%;

                     animation: vA-sweep 1.6s .8s both; }

  .vA-replay { display:inline-flex; align-items:center; gap:8px; padding:8px 14px;

                     display:inline-flex; align-items:center; justify-content:center;
                     color:var(--ink); font-size:8px; }
  `;

  function VariationA({ lang = 'en', videoMode = 'static' }) {

                </div>
              </div>
              <div className="vA-right">
                <div className="vA-portrait">
                  <img className="ph" src="images/jerric-portrait.png" alt="Jerric" />
                  <span className="corner">PORTRAIT / 01</span>
                  <span className="cornerR">LIVE</span>
                  <span className="tag">{t.role.toUpperCase()}</span>
                </div>

              <div className="mono">{t.citySub}</div>

            <div className="track">

                    <React.Fragment key={i}>
                      <span>{m}</span><span className="star">✦</span>

<!-- ─────────────────────────  MOUNT  ───────────────────────── -->
<script type="text/babel">
function Root() {
  const [lang, setLang] = React.useState('en');
  return (
    <>
      <window.VariationA lang={lang} videoMode="live" />
      <div className="lang-toggle">
        <button className={lang === 'en' ? 'active' : ''} onClick={() => setLang('en')}>EN</button>
        <button className={lang === 'zh' ? 'active' : ''} onClick={() => setLang('zh')}>中文</button>
      </div>
    </>
  );
}

function mount() {
  if (!window.VariationA || !window.VideoScrub || !window.ClubBuilding) {
    return setTimeout(mount, 30);
  }
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<Root />);
  setTimeout(() => {
    const sp = document.getElementById('splash');
    if (sp) { sp.classList.add('gone'); setTimeout(() => sp.remove(), 600); }
  }, 400);
}
mount();
</script>
